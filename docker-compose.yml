version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: trademeup_postgres
    environment:
      POSTGRES_USER: trademeup_user
      POSTGRES_PASSWORD: trademeup_pass
      POSTGRES_DB: trademeup
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trademeup_user -d trademeup"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
