[project]
name = "anps-trademeup"
version = "1.0.5"
description = "ANPS (AI News Prediction System) - Multi-Agent News-Based Market Prediction System"
authors = [{ name = "TradeMeUp Team" }]
readme = "README.md"
requires-python = ">=3.11"

# Runtime dependencies live in requirements.txt, which is the single source of
# truth: the Docker image installs requirements-docker.txt and there is no
# lockfile. Declaring them a second time here only let the two drift apart.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["src*"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "black>=26.5.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "ipython>=8.19.0",
    "ipykernel>=6.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
